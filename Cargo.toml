[package]
name = "uptime_lib"
version = "0.3.2"
edition = "2024"
description = "Multi-platform uptime library"
repository = "https://github.com/itchyny/uptime-rs"
authors = ["itchyny <itchyny@cybozu.co.jp>"]
license = "MIT"
readme = "README.md"
keywords = ["uptime"]
categories = ["os"]

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1

[dependencies]
thiserror = "2.0.21"

[target.'cfg(not(windows))'.dependencies]
libc = "0.2.191"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_SystemInformation"] }

[[bin]]
name = "uptime-rs"
path = "bin/main.rs"
